{% extends 'base.html' %}
{% block title %}Update Profile{% endblock %}

{% block content %}
<div class="my-4">
    <h1>Update Profile</h1>

    <form method="POST" action="{% url 'authentication:update_profile' user.id %}" class="col-md-6" novalidate>
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">
                        {% for error in field.errors %}
                            <div>{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'authentication:profile' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
