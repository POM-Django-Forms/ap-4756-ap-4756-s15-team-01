{% extends 'base.html' %}
{% block title %}Update an Author{% endblock %}

{% block content %}
<div class="my-4">
    <h1>Update an Author</h1>

    <form method="POST" action="{% url 'author:update_an_author' author.id %}" class="col-md-6" novalidate>
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">
                        {% for error in field.errors %}
                            <div>{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'author:list_of_authors' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
